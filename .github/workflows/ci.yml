name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cappy, POSTGRES_PASSWORD: cappy, POSTGRES_DB: cappy }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cappy" --health-interval 2s --health-retries 30
      stripe:
        image: stripe/stripe-mock
        ports: ["12111:12111"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen --all-packages
      # Known vulnerabilities in what the services install (P-32): the locked
      # third-party packages, never our own workspace.
      - name: Dependency audit
        run: |
          uv export --frozen --all-packages --no-emit-workspace --no-hashes --no-dev -o /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip --no-deps -r /tmp/requirements.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Unit, API, Postgres and Stripe contract tests
        run: uv run pytest -q
        env:
          CAPPY_TEST_PG: postgresql+asyncpg://cappy:cappy@localhost:5432/postgres
          CAPPY_TEST_STRIPE_MOCK: http://localhost:12111

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
      # What ships to browsers and phones (P-32); dev tooling does not.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit -p .
      - run: npm run build
      # The budgets and invariants the app keeps (size, translations, flags,
      # retry keys, targets): each fails the build when broken.
      - run: npm run check:size
      - run: npm run check:i18n
      - run: npm run check:flags
      - run: npm run check:attempt
      - run: npm run check:a11y

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, catalog, matching, booking, payments, notifications]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.12.2 }
      - run: terraform fmt -check -recursive infra
      - name: validate every root
        run: |
          for d in bootstrap envs/staging envs/prod localstack; do
            (cd infra/$d && terraform init -backend=false -input=false >/dev/null && terraform validate) || exit 1
          done

  # The whole platform in containers, the whole journey through it. Needs the
  # LOCALSTACK_AUTH_TOKEN repository secret; skipped (not failed) without it.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.LOCALSTACK_AUTH_TOKEN != ''
      - uses: astral-sh/setup-uv@v6
        if: env.LOCALSTACK_AUTH_TOKEN != ''
      - uses: hashicorp/setup-terraform@v3
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        with: { terraform_version: 1.12.2, terraform_wrapper: false }
      - name: up, e2e, and the Terraform event fabric against LocalStack
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: |
          (cd backend && uv sync --frozen --all-packages)
          make up
          make e2e
          make infra-local
          # A short run of the load test: racing buyers and concurrent browsing
          # with no 5xx and one winner per window (it caught a deadlock once).
          (cd backend && uv run python ../local/load.py 20 30)
      - name: logs on failure
        if: failure() && env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose logs --tail 200
