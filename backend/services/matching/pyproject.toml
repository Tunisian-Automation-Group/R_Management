[project]
name = "cappy-matching"
version = "0.1.0"
description = "Cappy matching service: feasibility, availability, pricing, ranking, browse"
requires-python = ">=3.12"
dependencies = [
    "cappy-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
cappy-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matching"]
