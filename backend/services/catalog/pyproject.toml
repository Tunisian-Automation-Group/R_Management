[project]
name = "cappy-catalog"
version = "0.1.0"
description = "Cappy catalog service: districts, owners, listings, idle windows"
requires-python = ">=3.12"
dependencies = [
    "cappy-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
]

[tool.uv.sources]
cappy-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog"]
