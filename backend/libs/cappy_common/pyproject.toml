[project]
name = "cappy-common"
version = "0.1.0"
description = "Shared models, settings, event bus and helpers for Cappy services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "redis>=5.1",
    # Windows has no system tz database; harmless elsewhere.
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cappy_common"]
