[project]
name = "cappy-backend"
version = "0.1.0"
description = "Cappy backend — Python microservices behind the Cappy PWA"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
cappy-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["libs", "services"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/Query() in defaults is the FastAPI idiom. E741: `l` for a listing
# mirrors the frontend, which makes the domain port easier to diff.
ignore = ["B008", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["cappy_common", "catalog", "matching", "booking", "gateway", "accounts"]
